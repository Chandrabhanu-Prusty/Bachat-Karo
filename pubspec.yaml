name: bachat_karo
description: Smart AI-assisted expense tracker for daily budgeting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Date & Formatting ──────────────────────────────────────────────────────
  intl: ^0.19.0

  # ── State Management ───────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Backend / Auth ─────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Secure Storage & Prefs ────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ── File Handling ─────────────────────────────────────────────────────────
  file_picker: ^8.0.3

  # ── Notifications ─────────────────────────────────────────────────────────
  # flutter_local_notifications: ^17.2.2

  # ── Icons ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/

# pubspec.yaml — add these under dependencies:
supabase_flutter: ^2.5.6
flutter_secure_storage: ^9.2.2  # for token storage
shared_preferences: ^2.3.2      # for theme/local prefs
file_picker: ^8.0.3             # for import feature
